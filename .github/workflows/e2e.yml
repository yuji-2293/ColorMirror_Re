name: E2E:Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "front/**"
      - "back/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: ["main"]
    paths:
      - "front/**"
      - "back/**"
      - ".github/workflows/e2e.yml"
defaults:
  run:
    working-directory: front/App_front

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.13.1"

jobs:
  e2eTest:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.3
          bundler-cache: true
          working-directory: back/App_back

      - name: Setup Database
        working-directory: back/App_back
        env:
          RAILS_ENV: test
          E2E_TEST: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        run: |
          bin/rails db:prepare
          bin/rails db:seed
          bin/rails runner 'puts "E2E USERS: #{User.pluck(:email).inspect}"'

      - name: Start Rails API
        working-directory: back/App_back
        env:
          RAILS_ENV: test
          E2E_FAKE_OPENAI: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        run: bin/rails server -b 0.0.0.0 -p 3000 &

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: front/App_front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front/App_front
        run: pnpm install
      - name: Install Browsers for e2e tests
        working-directory: front/App_front
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: front/App_front
        run: pnpm e2e
